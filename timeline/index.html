<script>var E=[{"d": "~73,000 BCE", "s": -73000, "t": "Blombos Cave engraved ochre", "r": "Africa", "m": "Craft & Decorative", "x": "A piece of ochre with a deliberate cross-hatched pattern, from South Africa. Among the earliest known abstract designs.", "u": "eras/prehistoric/paleolithic/"}, {"d": "≥45,500 years ago", "s": -43500, "t": "Sulawesi warty pig painting", "r": "Asia", "m": "Painting", "x": "A life-size pig painted in red ochre in Leang Tedongnge, Indonesia: among the oldest known figurative artworks.", "u": "eras/prehistoric/paleolithic/"}, {"d": "~40,000 years ago", "s": -38000, "t": "Lion-Man of Hohlenstein-Stadel", "r": "Europe", "m": "Sculpture", "x": "A mammoth-ivory figure with a human body and a lion's head, from Germany.", "u": "eras/prehistoric/paleolithic/"}, {"d": "~40,000–35,000 years ago", "s": -37000, "t": "Venus of Hohle Fels", "r": "Europe", "m": "Sculpture", "x": "A small carved mammoth-ivory female figure, among the oldest known depictions of the human body.", "u": "eras/prehistoric/paleolithic/"}, {"d": "~36,000 years ago", "s": -34000, "t": "Chauvet Cave paintings", "r": "Europe", "m": "Painting", "x": "Lions, rhinos and horses drawn with striking skill in southern France.", "u": "eras/prehistoric/paleolithic/"}, {"d": "~28,000–25,000 BCE", "s": -26000, "t": "Venus of Willendorf", "r": "Europe", "m": "Sculpture", "x": "An 11 cm limestone figurine found in Austria, tinted with red ochre.", "u": "eras/prehistoric/paleolithic/"}, {"d": "~17,000 years ago", "s": -15000, "t": "Lascaux Cave paintings", "r": "Europe", "m": "Painting", "x": "Hundreds of painted animals, including the famous Hall of the Bulls.", "u": "eras/prehistoric/paleolithic/"}, {"d": "~14,000 years ago", "s": -12000, "t": "Earliest Jōmon pottery", "r": "Asia", "m": "Craft & Decorative", "x": "Among the world's oldest pottery, from Japan, later decorated with cord-impressed patterns.", "u": "eras/prehistoric/neolithic/"}, {"d": "~9500 BCE", "s": -9500, "t": "Göbekli Tepe", "r": "Asia", "m": "Architecture", "x": "T-shaped stone pillars carved with animals, in present-day Türkiye, built by hunter-gatherers.", "u": "eras/prehistoric/mesolithic/"}, {"d": "~9000 BCE onward", "s": -9000, "t": "Levantine rock art, Spain", "r": "Europe", "m": "Painting", "x": "Small painted figures of hunters, archers and dancers in narrative scenes.", "u": "eras/prehistoric/mesolithic/"}, {"d": "~7200–6500 BCE", "s": -6850, "t": "Ain Ghazal statues", "r": "Asia", "m": "Sculpture", "x": "Large plaster figures with bitumen-outlined eyes, found in Jordan.", "u": "eras/prehistoric/neolithic/"}, {"d": "~7100–5700 BCE", "s": -6400, "t": "Çatalhöyük", "r": "Asia", "m": "Painting", "x": "A large settlement in Türkiye with painted and plastered house interiors.", "u": "eras/prehistoric/neolithic/"}, {"d": "~3200 BCE", "s": -3200, "t": "Newgrange passage tomb", "r": "Europe", "m": "Architecture", "x": "An Irish tomb with spiral carvings, aligned so the winter solstice sunrise lights the inner chamber.", "u": "eras/prehistoric/neolithic/"}, {"d": "~3000–2500 BCE", "s": -2750, "t": "Stonehenge", "r": "Europe", "m": "Architecture", "x": "A monument built in stages in England; the large sarsen stones were raised around 2500 BCE.", "u": "eras/prehistoric/neolithic/"}, {"d": "c. 2600–2400 BCE", "s": -2500, "t": "Standard of Ur", "r": "Asia", "m": "Craft & Decorative", "x": "A hollow box decorated with mosaic scenes, found in a royal grave at Ur (modern Iraq).", "u": "works/standard-of-ur/"}, {"d": "c. 2500 BCE", "s": -2500, "t": "Great Sphinx of Giza", "r": "Africa", "m": "Sculpture", "x": "A lion with a human head carved from a single outcrop of bedrock, about 73 m long and 20 m high.", "u": "works/great-sphinx/"}, {"d": "c. 1754 BCE", "s": -1754, "t": "Stele of Hammurabi", "r": "Asia", "m": "Sculpture", "x": "A tall stone pillar inscribed in cuneiform with nearly 300 laws.", "u": "works/hammurabi-stele/"}, {"d": "c. 1345 BCE", "s": -1345, "t": "Bust of Nefertiti", "r": "Africa", "m": "Sculpture", "x": "Found in 1912 in the workshop of the sculptor Thutmose at Amarna.", "u": "works/nefertiti-bust/"}, {"d": "c. 1323 BCE", "s": -1323, "t": "Mask of Tutankhamun", "r": "Africa", "m": "Craft & Decorative", "x": "The funerary mask lay over the mummy of the young pharaoh in his tomb, found by Howard Carter in 1922.", "u": "works/tutankhamun-mask/"}, {"d": "c. 575 BCE", "s": -575, "t": "Ishtar Gate", "r": "Asia", "m": "Architecture", "x": "The eighth gate of inner Babylon, built under Nebuchadnezzar II and faced with blue glazed bricks bearing bulls and dragons.", "u": "works/ishtar-gate/"}, {"d": "c. 460–450 BCE", "s": -455, "t": "Discobolus (Discus Thrower)", "r": "Europe", "m": "Sculpture", "x": "Myron's bronze original is lost; we know the work from Roman copies.", "u": "works/discobolus/"}, {"d": "447–432 BCE", "s": -440, "t": "The Parthenon", "r": "Europe", "m": "Architecture", "x": "A Doric temple to Athena designed by the architects Ictinus and Callicrates, with a sculptural program supervised by Phidias.", "u": "works/parthenon/"}, {"d": "c. 210 BCE", "s": -210, "t": "Terracotta Army", "r": "Asia", "m": "Sculpture", "x": "Thousands of life-size clay soldiers buried near the tomb of Qin Shi Huang, the first emperor of China.", "u": "works/terracotta-army/"}, {"d": "1st century BCE – 1st century CE", "s": -30, "t": "Laocoön and His Sons", "r": "Europe", "m": "Sculpture", "x": "A Hellenistic group of a Trojan priest and his sons attacked by sea serpents.", "u": "works/laocoon/"}, {"d": "early 1st century CE", "s": 10, "t": "Augustus of Prima Porta", "r": "Europe", "m": "Sculpture", "x": "A statue of the first Roman emperor in an idealized, youthful pose borrowed from Greek sculpture, with a breastplate carved with scenes of Roman victory.", "u": "works/augustus-prima-porta/"}, {"d": "c. 126 CE", "s": 126, "t": "The Pantheon", "r": "Europe", "m": "Architecture", "x": "Completed under Hadrian, its dome, about 43 m wide, remains the largest unreinforced concrete dome in the world.", "u": "works/pantheon/"}, {"d": "537 CE", "s": 537, "t": "Hagia Sophia", "r": "Asia", "m": "Architecture", "x": "Built for the emperor Justinian, its huge central dome appears to float on a ring of windows.", "u": "works/hagia-sophia/"}, {"d": "691–692 CE", "s": 691, "t": "Dome of the Rock", "r": "Asia", "m": "Architecture", "x": "One of the earliest great works of Islamic architecture, with an octagonal plan and interior mosaics in vegetal and calligraphic patterns that avoid depicting living beings.", "u": "works/dome-of-the-rock/"}, {"d": "c. 725 CE", "s": 725, "t": "Yaxchilan Lintel 24", "r": "Americas", "m": "Sculpture", "x": "A Maya carved lintel shows Lady Xoc kneeling before her husband Shield Jaguar, who holds a torch.", "u": "works/yaxchilan-lintel-24/"}, {"d": "c. 800", "s": 800, "t": "Book of Kells", "r": "Europe", "m": "Manuscript & Textile", "x": "An illuminated manuscript of the four Gospels made by monks, covered in interlace, animals and Celtic spirals.", "u": "works/book-of-kells/"}, {"d": "c. 800 CE", "s": 800, "t": "Borobudur", "r": "Asia", "m": "Architecture", "x": "The world's largest Buddhist temple, a stepped stupa decorated with over 2,600 relief panels.", "u": "works/borobudur/"}, {"d": "c. 1000", "s": 1000, "t": "Travelers Among Mountains and Streams", "r": "Asia", "m": "Painting", "x": "A monumental hanging scroll in which tiny travelers pass beneath a massive cliff.", "u": "works/travelers-among-mountains/"}, {"d": "c. 1070s", "s": 1075, "t": "Bayeux Tapestry", "r": "Europe", "m": "Manuscript & Textile", "x": "An embroidered strip about 70 m long telling the story of the Norman conquest of England in 1066.", "u": "works/bayeux-tapestry/"}, {"d": "early 12th century", "s": 1130, "t": "Angkor Wat", "r": "Asia", "m": "Architecture", "x": "Built for Suryavarman II as a Hindu temple, later Buddhist.", "u": "works/angkor-wat/"}, {"d": "rebuilt after 1194", "s": 1220, "t": "Chartres Cathedral", "r": "Europe", "m": "Architecture", "x": "Rebuilt rapidly after a fire, it keeps most of its medieval stained glass.", "u": "works/chartres-cathedral/"}, {"d": "12th–15th century", "s": 1300, "t": "Ife head", "r": "Africa", "m": "Sculpture", "x": "Naturalistic heads cast by the Yoruba people at Ife, striking to European visitors who could not believe African origins.", "u": "works/ife-head/"}, {"d": "c. 1305", "s": 1305, "t": "Scrovegni Chapel frescoes", "r": "Europe", "m": "Painting", "x": "Giotto's cycle of the lives of Mary and Christ gave painted figures weight, emotion and space.", "u": "works/scrovegni-chapel/"}, {"d": "mostly 13th–14th century", "s": 1350, "t": "The Alhambra", "r": "Europe", "m": "Architecture", "x": "A palace and fortress of the Nasrid dynasty, famous for carved stucco, geometric tilework, calligraphy and courtyards with water.", "u": "works/alhambra/"}, {"d": "c. 1250–1500", "s": 1400, "t": "Moai", "r": "Oceania", "m": "Sculpture", "x": "Nearly 900 monumental figures carved by the Rapa Nui people, typically representing revered ancestors.", "u": "works/moai/"}, {"d": "1434", "s": 1434, "t": "The Arnolfini Portrait", "r": "Europe", "m": "Painting", "x": "A double portrait in a richly detailed interior, with a convex mirror on the back wall reflecting the room and two onlookers.", "u": "works/arnolfini-portrait/"}, {"d": "c. 1450", "s": 1450, "t": "Machu Picchu", "r": "Americas", "m": "Architecture", "x": "An Inca royal estate in the Andes.", "u": "works/machu-picchu/"}, {"d": "c. 1484–86", "s": 1485, "t": "The Birth of Venus", "r": "Europe", "m": "Painting", "x": "The goddess arrives on a shell, blown ashore by winds.", "u": "works/birth-of-venus/"}, {"d": "c. 1495–98", "s": 1496, "t": "The Last Supper", "r": "Europe", "m": "Painting", "x": "Leonardo painted the moment Christ announces a betrayal, with the apostles reacting in groups of three.", "u": "works/last-supper/"}, {"d": "1501–04", "s": 1503, "t": "David", "r": "Europe", "m": "Sculpture", "x": "About 5 m tall, carved from a single block that other sculptors had abandoned.", "u": "works/david-michelangelo/"}, {"d": "c. 1503–19", "s": 1510, "t": "Mona Lisa", "r": "Europe", "m": "Painting", "x": "A portrait, likely of Lisa Gherardini, with soft blended shading (sfumato) and an imaginary landscape.", "u": "works/mona-lisa/"}, {"d": "1508–12", "s": 1510, "t": "Sistine Chapel Ceiling", "r": "Europe", "m": "Painting", "x": "Hundreds of figures illustrate scenes from Genesis, including the Creation of Adam.", "u": "works/sistine-ceiling/"}, {"d": "1509–11", "s": 1510, "t": "The School of Athens", "r": "Europe", "m": "Painting", "x": "Ancient philosophers gathered in a grand classical building, with Plato and Aristotle at the center.", "u": "works/school-of-athens/"}, {"d": "1514", "s": 1514, "t": "Melencolia I", "r": "Europe", "m": "Print & Drawing", "x": "A brooding winged figure surrounded by tools and a magic square.", "u": "works/melencolia-i/"}, {"d": "1565", "s": 1565, "t": "The Hunters in the Snow", "r": "Europe", "m": "Painting", "x": "Part of a series on the months or seasons, it shows returning hunters above a village of skaters.", "u": "works/hunters-in-the-snow/"}, {"d": "1599–1600", "s": 1600, "t": "The Calling of Saint Matthew", "r": "Europe", "m": "Painting", "x": "A beam of light cuts across a dim tavern as Christ points to Matthew.", "u": "works/calling-of-st-matthew/"}, {"d": "16th–17th century", "s": 1600, "t": "Benin Bronzes", "r": "Africa", "m": "Sculpture", "x": "Hundreds of relief plaques from the Kingdom of Benin recorded court history.", "u": "works/benin-plaques/"}, {"d": "c. 1620", "s": 1620, "t": "Judith Slaying Holofernes", "r": "Europe", "m": "Painting", "x": "Judith and her maid decisively kill an enemy general.", "u": "works/judith-slaying-holofernes/"}, {"d": "1632–53", "s": 1640, "t": "Taj Mahal", "r": "Asia", "m": "Architecture", "x": "A mausoleum built by Mughal emperor Shah Jahan for his wife Mumtaz Mahal.", "u": "works/taj-mahal/"}, {"d": "1642", "s": 1642, "t": "The Night Watch", "r": "Europe", "m": "Painting", "x": "A group portrait of a civic militia company shown in action rather than posed in rows.", "u": "works/night-watch/"}, {"d": "1647–52", "s": 1650, "t": "The Ecstasy of Saint Teresa", "r": "Europe", "m": "Sculpture", "x": "Teresa swoons as an angel prepares to pierce her heart.", "u": "works/ecstasy-of-st-teresa/"}, {"d": "1656", "s": 1656, "t": "Las Meninas", "r": "Europe", "m": "Painting", "x": "The young princess with her attendants, and the painter himself at his easel.", "u": "works/las-meninas/"}, {"d": "c. 1665", "s": 1665, "t": "Girl with a Pearl Earring", "r": "Europe", "m": "Painting", "x": "A tronie, a character study rather than a portrait of a specific person.", "u": "works/girl-with-a-pearl-earring/"}, {"d": "1767–68", "s": 1767, "t": "The Swing", "r": "Europe", "m": "Painting", "x": "A frothy, playful scene of a young woman on a swing in a lush garden, typical of Rococo's light, decorative spirit.", "u": "works/the-swing/"}, {"d": "1793", "s": 1793, "t": "The Death of Marat", "r": "Europe", "m": "Painting", "x": "A revolutionary leader murdered in his bath is portrayed like a martyr.", "u": "works/death-of-marat/"}, {"d": "1814", "s": 1814, "t": "The Third of May 1808", "r": "Europe", "m": "Painting", "x": "French soldiers execute Spanish civilians.", "u": "works/third-of-may-1808/"}, {"d": "1830", "s": 1830, "t": "Liberty Leading the People", "r": "Europe", "m": "Painting", "x": "An allegory of liberty leads insurgents over barricades during the July Revolution.", "u": "works/liberty-leading-the-people/"}, {"d": "c. 1831", "s": 1831, "t": "The Great Wave off Kanagawa", "r": "Asia", "m": "Print & Drawing", "x": "A towering wave frames Mount Fuji in the distance.", "u": "works/great-wave/"}, {"d": "1844", "s": 1844, "t": "Rain, Steam and Speed", "r": "Europe", "m": "Painting", "x": "A train rushes across a bridge in a swirl of weather.", "u": "works/rain-steam-and-speed/"}, {"d": "1849", "s": 1849, "t": "The Stone Breakers", "r": "Europe", "m": "Painting", "x": "Two laborers on a roadside, painted life-size as if they were important subjects.", "u": "works/stone-breakers/"}, {"d": "1863", "s": 1863, "t": "Olympia", "r": "Europe", "m": "Painting", "x": "A nude who stares back at the viewer, painted with flat, bold areas of tone.", "u": "works/olympia/"}, {"d": "1872", "s": 1872, "t": "Impression, Sunrise", "r": "Europe", "m": "Painting", "x": "A harbor in morning mist with a small orange sun.", "u": "works/impression-sunrise/"}, {"d": "1884–86", "s": 1885, "t": "A Sunday Afternoon on the Island of La Grande Jatte", "r": "Europe", "m": "Painting", "x": "Thousands of tiny dots of color (pointillism) form a leisurely park scene, built from scientific ideas about color.", "u": "works/grande-jatte/"}, {"d": "1889", "s": 1889, "t": "The Starry Night", "r": "Europe", "m": "Painting", "x": "Painted from memory of the view from his window at the asylum at Saint-Rémy, with swirling sky and a cypress.", "u": "works/starry-night/"}, {"d": "1887–89", "s": 1889, "t": "Eiffel Tower", "r": "Europe", "m": "Architecture", "x": "Built for the 1889 World's Fair, it was criticized by some artists at first.", "u": "works/eiffel-tower/"}, {"d": "c. 1893", "s": 1893, "t": "The Basket of Apples", "r": "Europe", "m": "Painting", "x": "Table and objects are seen from several viewpoints at once.", "u": "works/basket-of-apples/"}, {"d": "1907", "s": 1907, "t": "Les Demoiselles d'Avignon", "r": "Europe", "m": "Painting", "x": "Five women in angular, mask-like forms break with perspective.", "u": "works/les-demoiselles/"}, {"d": "1910", "s": 1910, "t": "The Dance (II)", "r": "Europe", "m": "Painting", "x": "Five nude figures dance in a ring, painted in three flat colors: red, blue and green.", "u": "works/the-dance-matisse/"}, {"d": "1913", "s": 1913, "t": "Composition VII", "r": "Europe", "m": "Painting", "x": "An explosion of color and form with no recognizable subject, among the first major abstract paintings.", "u": "works/composition-vii/"}, {"d": "1915", "s": 1915, "t": "Black Square", "r": "Europe", "m": "Painting", "x": "A black square on a white ground, offered as a new beginning for art with no representation at all.", "u": "works/black-square/"}, {"d": "1917", "s": 1917, "t": "Fountain", "r": "Europe", "m": "Installation & Digital", "x": "A urinal signed 'R.", "u": "works/fountain-duchamp/"}, {"d": "1931", "s": 1931, "t": "The Persistence of Memory", "r": "Europe", "m": "Painting", "x": "Soft melting watches drape over a dreamlike landscape.", "u": "works/persistence-of-memory/"}, {"d": "1935–37", "s": 1936, "t": "Fallingwater", "r": "Americas", "m": "Architecture", "x": "A house cantilevered over a waterfall, built to blend with nature while using modern materials.", "u": "works/fallingwater/"}, {"d": "1937", "s": 1937, "t": "Guernica", "r": "Europe", "m": "Painting", "x": "A monochrome mural responding to the bombing of a Basque town during the Spanish Civil War.", "u": "works/guernica/"}, {"d": "1939", "s": 1939, "t": "The Two Fridas", "r": "Americas", "m": "Painting", "x": "Two versions of the artist sit side by side, hearts exposed and joined by a vein.", "u": "works/two-fridas/"}, {"d": "1942", "s": 1942, "t": "Nighthawks", "r": "Americas", "m": "Painting", "x": "Four people in an all-night diner seen through a glass wall.", "u": "works/nighthawks/"}, {"d": "1942–43", "s": 1943, "t": "Broadway Boogie Woogie", "r": "Europe", "m": "Painting", "x": "A grid of colored squares inspired by New York streets and jazz, breaking Mondrian's earlier strict black lines.", "u": "works/broadway-boogie-woogie/"}, {"d": "1950", "s": 1950, "t": "Autumn Rhythm (Number 30)", "r": "Americas", "m": "Painting", "x": "Paint dripped and poured onto a canvas laid on the floor.", "u": "works/autumn-rhythm/"}, {"d": "1962", "s": 1962, "t": "Campbell's Soup Cans", "r": "Americas", "m": "Painting", "x": "Thirty-two canvases, one for each soup flavor then sold.", "u": "works/campbells-soup-cans/"}, {"d": "1965 onward", "s": 1965, "t": "Infinity Mirror Rooms", "r": "Asia", "m": "Installation & Digital", "x": "Mirrored rooms that appear to repeat endlessly with dots, lights or pumpkins.", "u": "works/infinity-mirror-rooms/"}, {"d": "1977", "s": 1977, "t": "Warlugulong", "r": "Oceania", "m": "Painting", "x": "A major work from the Papunya Tula movement, mapping Dreaming stories and country in dots and lines.", "u": "works/warlugulong/"}, {"d": "1982", "s": 1982, "t": "Untitled (Skull)", "r": "Americas", "m": "Painting", "x": "A raw, scratchy skull on a blue background.", "u": "works/untitled-skull/"}, {"d": "1991", "s": 1991, "t": "The Physical Impossibility of Death in the Mind of Someone Living", "r": "Europe", "m": "Installation & Digital", "x": "A shark suspended in a tank of preservative.", "u": "works/physical-impossibility/"}, {"d": "1997", "s": 1997, "t": "Guggenheim Museum Bilbao", "r": "Europe", "m": "Architecture", "x": "Curving metal-clad forms transformed a former industrial city; the term 'Bilbao effect' describes a landmark museum reviving a place.", "u": "works/guggenheim-bilbao/"}, {"d": "1999", "s": 1999, "t": "Maman", "r": "Europe", "m": "Sculpture", "x": "A giant spider about 10 m high, carrying a sac of marble eggs, a tribute to the artist's mother, a weaver and restorer.", "u": "works/maman/"}, {"d": "2010", "s": 2010, "t": "Sunflower Seeds", "r": "Asia", "m": "Installation & Digital", "x": "One hundred million hand-painted porcelain seeds, made by about 1,600 artisans in Jingdezhen, covering the floor of Tate's Turbine Hall.", "u": "works/sunflower-seeds/"}, {"d": "2018", "s": 2018, "t": "Love is in the Bin", "r": "Europe", "m": "Painting", "x": "The painting Girl with Balloon partly shredded itself in the auction room right after it sold at Sotheby's for over £1 million.", "u": "works/love-is-in-the-bin/"}, {"d": "2021", "s": 2021, "t": "Everydays: The First 50
